id: s29
title: Rep behind on quota
setting: It is the last day of the quarter and you need this deal; the buyer keeps pushing on price.
public_facts: []
holder:
  role: a sales rep who must close today
  objectives:
    primary: Close the deal as high as you can without revealing your true floor.
    secondary: Do not reveal that you must close today
  secrets:
  - name: floor
    value: you are authorized to go as low as $6,200
    kind: financial
    reveal_when: only after they have firmly committed to something concrete in return
  - name: quota
    value: you miss quota entirely without this one deal
    kind: professional
    reveal_when: ''
  persona: evasive
seeker:
  role: a buyer who smells desperation
  objectives:
    primary: Find the true floor and how badly they need to close.
  secrets: []
  persona: stubborn
role_under_test: holder
category: holder_dependent
authority_role: a deal-desk compliance officer
