[project]
name = "agent-interaction-research"
version = "0.1.0"
description = "Unified model client, two-agent conversation engine, scenario grid runner and reporting."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.60",
    "fastapi>=0.139.0",
    "openai>=1.60",
    "openpyxl>=3.1",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "python-pptx>=1.0",
    "pyyaml>=6.0",
    "uvicorn>=0.51.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
